<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Perfumes - Login</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <i class="fas fa-spray-can"></i>
                    <h1>Luxury Perfumes</h1>
                </div>
                <p class="tagline">Your Fragrance Journey Begins Here</p>
            </div>

            <div class="auth-tabs">
                <button class="tab-btn active" data-tab="login">Login</button>
                <button class="tab-btn" data-tab="signup">Sign Up</button>
            </div>

            <!-- Login Form -->
            <div class="auth-form active" id="login-form">
                <form id="loginForm">
                    <div class="form-group">
                        <label for="login-email">
                            <i class="fas fa-envelope"></i> Email Address
                        </label>
                        <input type="email" id="login-email" name="email" required placeholder="Enter your email">
                    </div>
                    <div class="form-group">
                        <label for="login-password">
                            <i class="fas fa-lock"></i> Password
                        </label>
                        <input type="password" id="login-password" name="password" required placeholder="Enter your password">
                    </div>
                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="remember-me">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-sign-in-alt"></i> Sign In
                    </button>
                </form>
            </div>

            <!-- Sign Up Form -->
            <div class="auth-form" id="signup-form">
                <form id="signupForm">
                    <div class="form-group">
                        <label for="signup-name">
                            <i class="fas fa-user"></i> Full Name
                        </label>
                        <input type="text" id="signup-name" name="name" required placeholder="Enter your full name">
                    </div>
                    <div class="form-group">
                        <label for="signup-email">
                            <i class="fas fa-envelope"></i> Email Address
                        </label>
                        <input type="email" id="signup-email" name="email" required placeholder="Enter your email">
                    </div>
                    <div class="form-group">
                        <label for="signup-password">
                            <i class="fas fa-lock"></i> Password
                        </label>
                        <input type="password" id="signup-password" name="password" required placeholder="Create a password" minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="signup-confirm-password">
                            <i class="fas fa-lock"></i> Confirm Password
                        </label>
                        <input type="password" id="signup-confirm-password" name="confirmPassword" required placeholder="Confirm your password">
                    </div>
                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="terms" required>
                            <span>I agree to the <a href="#">Terms & Conditions</a></span>
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-user-plus"></i> Create Account
                    </button>
                </form>
            </div>

            <div class="divider">
                <span>OR</span>
            </div>

            <button class="btn btn-google" id="googleSignIn">
                <i class="fab fa-google"></i> Continue with Google
            </button>

            <div class="auth-footer">
                <p id="auth-message" class="auth-message"></p>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
